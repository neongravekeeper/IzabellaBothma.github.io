<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e6d9f5 0%, #f0e6fa 50%, #e6d9f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            position: relative;
            text-align: center;
            background: linear-gradient(135deg, #f5f0ff 0%, #e6d9f5 100%);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(186, 85, 211, 0.15);
            max-width: 700px;
            border: 1px solid rgba(186, 85, 211, 0.2);
            animation: float 3s ease-in-out infinite;
            overflow: hidden;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #b88ec7;
            border-radius: 50%;
            animation: twinkle 2.5s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }
        
        /* Positioning stars around the border */
        .star:nth-child(1) { top: 15px; left: 20px; animation-delay: 0s; }
        .star:nth-child(2) { top: 10px; left: 80px; animation-delay: 0.3s; }
        .star:nth-child(3) { top: 20px; right: 60px; animation-delay: 0.6s; }
        .star:nth-child(4) { top: 15px; right: 15px; animation-delay: 0.9s; }
        .star:nth-child(5) { bottom: 20px; right: 30px; animation-delay: 1.2s; }
        .star:nth-child(6) { bottom: 15px; right: 100px; animation-delay: 1.5s; }
        .star:nth-child(7) { bottom: 20px; left: 80px; animation-delay: 1.8s; }
        .star:nth-child(8) { bottom: 15px; left: 20px; animation-delay: 2.1s; }
        .star:nth-child(9) { top: 50%; left: 10px; animation-delay: 0.4s; }
        .star:nth-child(10) { top: 50%; right: 10px; animation-delay: 1.1s; }
        .star:nth-child(11) { top: 30%; left: 8px; animation-delay: 0.7s; }
        .star:nth-child(12) { bottom: 35%; right: 8px; animation-delay: 1.6s; }
        
        .content {
            position: relative;
            z-index: 1;
        }
        
        h1 {
            color: #8b5fbf;
            margin-bottom: 20px;
            font-size: 2.5em;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        p {
            color: #9966cc;
            font-size: 1.1em;
            margin: 20px 0;
            line-height: 1.8;
            font-weight: 300;
        }
        
        .accent {
            color: #b88ec7;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        
        <div class="content">
            <h1>Welcome</h1>
            <p class="accent">Edit this page to share your story.</p>
        </div>
    </div>
</body>
</html>
